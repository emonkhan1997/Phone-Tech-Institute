<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"><style>.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:720px}.admin-table th,.admin-table td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left}.status{padding:5px 9px;border-radius:999px;font-size:12px}.pending{background:#fff7ed;color:#c2410c}.approved{background:#ecfdf5;color:#047857}.rejected{background:#fef2f2;color:#b91c1c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input{flex:1;min-width:180px}.smallbtn{padding:7px 10px;border:0;border-radius:8px;cursor:pointer}.danger{background:#fee2e2;color:#991b1b}</style></head>
<body><header class="header"><div class="container nav"><b>Phone Tech Admin Dashboard</b><div><a href="index.html">Website ↗</a> <button class="smallbtn" onclick="logout()">Logout</button></div></div></header>
<section class="section"><div class="container"><div class="section-head"><span>ADMIN PANEL</span><h2>ভর্তি আবেদনসমূহ</h2></div><div class="toolbar"><input id="search" placeholder="নাম / ফোন / কোর্স দিয়ে খুঁজুন"><button class="btn primary" onclick="loadApps()">Refresh</button><button class="smallbtn danger" onclick="clearDemo()">Clear Local Demo</button></div><div id="info" style="margin-bottom:12px"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>তারিখ</th><th>নাম</th><th>ফোন</th><th>কোর্স</th><th>অবস্থা</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" style="padding:30px;text-align:center;color:#64748b;display:none">কোনো আবেদন পাওয়া যায়নি।</div></div></section>
<script src="script.js"></script><script>
if(!sessionStorage.getItem('pti_token')&&!sessionStorage.getItem('pti_demo')) location.href='admin.html';
let all=[];
async function loadApps(){const url=localStorage.getItem('pti_api_url')||''; if(!url){all=JSON.parse(localStorage.getItem('pti_applications')||'[]'); render(); return;} try{const r=await fetch(url,{method:'POST',body:new URLSearchParams({action:'list',token:sessionStorage.getItem('pti_token')})});const j=await r.json();if(!j.ok)throw new Error(j.error);all=j.data||[];render();}catch(e){info.textContent='Error: '+e.message;}}
function render(){const q=(search.value||'').toLowerCase(); const x=all.filter(a=>Object.values(a).join(' ').toLowerCase().includes(q)); rows.innerHTML=x.map(a=>`<tr><td>${fmt(a.createdAt)}</td><td><b>${esc(a.name)}</b></td><td>${esc(a.phone)}</td><td>${esc(a.course)}</td><td><span class="status ${String(a.status).toLowerCase()}">${esc(a.status||'Pending')}</span></td><td><select onchange="setStatus('${esc(a.id)}',this.value)"><option ${a.status==='Pending'?'selected':''}>Pending</option><option ${a.status==='Approved'?'selected':''}>Approved</option><option ${a.status==='Rejected'?'selected':''}>Rejected</option></select></td></tr>`).join(''); empty.style.display=x.length?'none':'block'; info.textContent=`মোট আবেদন: ${all.length}`;}
async function setStatus(id,status){const url=localStorage.getItem('pti_api_url')||''; if(!url){all=all.map(a=>a.id==id?{...a,status}:a);localStorage.setItem('pti_applications',JSON.stringify(all));render();return;} try{const r=await fetch(url,{method:'POST',body:new URLSearchParams({action:'status',token:sessionStorage.getItem('pti_token'),id,status})});const j=await r.json();if(!j.ok)throw new Error(j.error);loadApps();}catch(e){alert(e.message);}}
function clearDemo(){if(confirm('Local demo applications মুছে ফেলবেন?')){localStorage.removeItem('pti_applications');loadApps();}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));} function fmt(v){if(!v)return'';try{return new Date(v).toLocaleString('bn-BD');}catch{return v;}}
search.addEventListener('input',render);loadApps();
</script></body></html>
