<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - Phone Tech</title><link rel="stylesheet" href="style.css"></head>
<body style="background:#071a29;min-height:100vh;display:grid;place-items:center"><div style="width:min(430px,92%);background:#fff;padding:32px;border-radius:20px;box-shadow:0 20px 60px #0004">
<img src="assets/logo.jpg" style="width:80px;height:80px;object-fit:cover;border-radius:50%;display:block;margin:auto"><h2 style="text-align:center">Admin Login</h2><p style="text-align:center;color:#64748b">Phone Tech Servicing Institute</p>
<form id="loginForm" style="display:grid;gap:12px"><input id="user" placeholder="Username" required><input id="pass" type="password" placeholder="Password" required><button class="btn primary">Login</button><div id="msg"></div></form>
<hr><label style="font-size:13px;color:#64748b">Google Apps Script Web App URL (একবার বসালেই হবে)</label><input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" style="margin-top:8px"><button type="button" class="btn ghost" onclick="saveApiUrl()" style="margin-top:8px">API URL Save</button>
<p style="font-size:12px;color:#94a3b8;margin-top:18px">Backend URL না দিলে Local Demo mode চালু থাকবে। নিরাপদ Admin Login-এর জন্য Google Apps Script backend ব্যবহার করুন।</p><a href="index.html">← মূল ওয়েবসাইটে ফিরে যান</a></div>
<script src="script.js"></script><script>
const api=document.getElementById('apiUrl'); api.value=localStorage.getItem('pti_api_url')||'';
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault(); const msg=document.getElementById('msg'); const url=localStorage.getItem('pti_api_url')||''; const u=user.value.trim(), p=pass.value; msg.textContent='Checking...';
if(!url){if(u==='admin'&&p==='admin123'){sessionStorage.setItem('pti_demo','1');location.href='dashboard.html';}else{msg.textContent='Username বা Password ভুল।';msg.style.color='crimson';}return;}
try{const r=await fetch(url,{method:'POST',body:new URLSearchParams({action:'login',username:u,password:p})});const j=await r.json(); if(!j.ok) throw new Error(j.error||'Login failed'); sessionStorage.setItem('pti_token',j.token); location.href='dashboard.html';}catch(err){msg.textContent=err.message;msg.style.color='crimson';}});
</script></body></html>
